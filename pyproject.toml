[project]
authors = [{name = "Mike Salvatore", email="mike.salvatore@akamai.com"}]
classifiers=[
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "loguru (>=0.7.3, <1.0)",
    "monkey-types (>=1.0.0, <3.0.0)",
    "pydantic-settings (>=2.7.1, <3.0)",
    "pygments (>=2.19.1,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
]
description = "A collection of functions and objects that help the Monkey team bootstrap, build, and maintain services"
dynamic = ["readme"]
license = "GPLv3"
name = "monkey-service-kit"
requires-python = ">=3.11, <4.0"
version = "v2.6.0"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[project.urls]
Repository = "https://github.com/guardicode/service-kit"

[tool.cruft]
skip = [
    "service_kit/__init__.py",
    "README.md",
    "CHANGELOG.md",
    "vulture_allowlist.py"
]

[tool.ruff]
line-length = 100
# pre-commit passes files by name; without this, ruff ignores the exclude list for them
force-exclude = true
extend-exclude = [
    "template_service.py",
    "vulture_allowlist.py",
]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors, incl. E501 line length (flake8 parity)
    "W",    # pycodestyle warnings (flake8 parity)
    "C90",  # mccabe complexity (flake8 parity)
    "I",    # Import sorting (isort replacement)
    "S",    # Security checks (Bandit - primary dlint replacement)
    "B",    # Bugbear (common bugs and design issues)
    "BLE",  # Blind except checks
    "RUF",  # Astral's native rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Re-exports
    "I001",  # Import order may matter; isort skipped these files too
]
"tests/**" = [
    "S101",  # pytest relies on assert
    "S105",  # Hardcoded passwords are fine in test fixtures
    "S106",
    "S108",  # Temp file paths are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["service_kit"]

[tool.mypy]
check_untyped_defs = true
exclude = "vulture_allowlist.py | template_service.py"

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = 1
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(module)s.%(funcName)s.%(lineno)d: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-v --capture=no tests"

[tool.vulture]
exclude=[]
paths = ["service_kit", "vulture_allowlist.py"]

[tool.poetry]
readme = "README.md"
include = ["CHANGELOG.md", "README.md"]
packages = [{include = "service_kit"}]

[tool.poetry.group.dev.dependencies]
ruff = "0.17.5"
mypy = "1.19.0"
pudb = ">=2025.1.5"
pynvim = ">=0.4.3, <1.0.0"
pytest = ">=7.1.0, <8.0.0"
pytest-cov = ">=3.0.0, <4.0.0"
pytest-xdist = ">=3.3.1"
vulture = "2.13"
httpx = ">=0.28.1, <1.0.0"
jinja2 = ">=3.1.5, <4.0.0"
requests = ">=2.32.3, <3.0.0"
sphinx = ">=8.2.1, <9.0.0"
sphinx-autodoc-typehints = ">=3.1.0, <4.0.0"
sphinx-rtd-theme = ">=3.0.2, <4.0.0"
myst-parser = ">=4.0.1, <5.0.0"
sphinx-autoapi = ">=3.6.0, <4.0.0"
autodoc-pydantic = ">=2.2.0, <3.0.0"
types-pyyaml = ">=6.0.12.20250516, <7.0.0"

[project.optional-dependencies]
psycopg = ["psycopg (>=3.2.4, <4.0.0)"]
api = ["fastapi (>=0.115.6, <1.0.0)", "python-ulid (>=3.0.0, <4.0.0)", "uvicorn (>=0.34.0, <1.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
