# prepare-commit-msg runs merge-issue-number; commit-msg runs gitlint
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
default_stages: [pre-commit]
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/guardicode/gitlint-commit-hook
    rev: v0.1.0
    hooks:
      - id: gitlint
        args: [--require-jira-prefix, --require-pr-number-on-merge]
  - repo: https://github.com/mssalvatore/merge-issue-number-hook
    rev: v1.0.0
    hooks:
      - id: merge-issue-number
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        exclude: "(?x)(^vulture_allowlist.py$ | ^template_service.py$)"
        args: [--ignore-missing-imports, --check-untyped-defs]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.13
    hooks:
      - id: vulture
  - repo: https://github.com/mssalvatore/changelog-formatter-commit-hook
    rev: v1.0.2
    hooks:
      - id: changelog-formatter
